name: Code Quality & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-sanity:
    name: Android Lint & Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Check for Uncommitted Secrets
        run: |
          echo "Scanning repository for accidentally tracked private keys..."
          if git ls-files | grep -E '\.(key|pub)$|tools/adbkey'; then
            echo "::error::Private key files found in git index!"
            exit 1
          fi
          echo "Repository is clean of private keys."

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue || true

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
