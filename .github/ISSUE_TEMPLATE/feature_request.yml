name: 💡 Feature Request
description: Propose a new diagnostics tool, remote companion feature, or TV dashboard capability
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Please remember that OmniDeck strictly preserves a **zero external dependency** architecture and a strict **< 20 MB RAM envelope** on Android TV.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: "e.g., I'm always frustrated when I want to monitor..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see happen.
    validations:
      required: true

  - type: checkboxes
    id: constraints-check
    attributes:
      label: Hardware & Dependency Evaluation
      options:
        - label: This feature can be implemented using standard Java/Android APIs without adding external libraries.
          required: true
        - label: This feature will not cause background thread loops or high CPU/RAM consumption on 1 GB Android TVs.
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've evaluated.
